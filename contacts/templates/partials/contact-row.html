<tr>
    <td>{{ contact.name }}</td>
    <td>{{ contact.email }}</td>
    <td>{{ contact.created_at|date:"M d, Y" }}</td>
    <td>
        {%if contact.file%}
            <a href="{{contact.file.url}}" class="bg-green-500 px-2 py-3 rounded !text-black">Download Document</a>
        {%else%}
            <p>No Document</p>
        {%endif%}

        
    </td>
    
    <td>
        <button class="btn btn-xs btn-error !text-center">Delete</button>
    </td>
</tr>
